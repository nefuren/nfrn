[project]
name = "ip-test-desk"
version = "0.1.0"
description = "Local-only security monitoring dashboard backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "psutil>=6.1",
  "pydantic-settings>=2.7",
  "defusedxml>=0.7.1",
  "maxminddb>=2.6",
  "pip-audit>=2.7",  # 依存脆弱性パネルで使う
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
  "bandit[toml]>=1.8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S603"]  # subprocess は runner.py の固定引数でのみ使う（bandit B602 で shell=True を検出）

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S108"]

[tool.bandit]
exclude_dirs = ["tests"]
# B404/B603: subprocess の import と shell=False 呼び出しは runner.py で意図的に使用
skips = ["B404", "B603"]
