title = "IP TEST DESK gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "desk-token"
description = "IP TEST DESK access token"
regex = '''DESK_TOKEN\s*=\s*['"]?[A-Za-z0-9_\-]{16,}'''
keywords = ["DESK_TOKEN"]

[allowlist]
description = "test fixtures use obviously fake tokens"
paths = ['''backend/tests/.*''']
