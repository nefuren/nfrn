name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint (ruff)
        run: python -m ruff check .
      - name: Security lint (bandit)
        run: python -m bandit -q -c pyproject.toml -r app
      - name: Tests
        run: python -m pytest -q
      - name: Dependency audit (pip-audit)
        run: python -m pip_audit --skip-editable --progress-spinner off

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check frontend exists
        id: check
        shell: bash
        run: |
          if [ -f frontend/package-lock.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint
      - if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm test
      - if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm run build
      - name: Dependency audit (npm audit)
        if: steps.check.outputs.present == 'true'
        working-directory: frontend
        run: npm audit --audit-level=high
